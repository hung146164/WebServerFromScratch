<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebServerVdt - Test Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: #89b4fa;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #74c7ec;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #313244;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .success {
            color: #a6e3a1;
        }

        .error {
            color: #f38ba8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 WebServerVdt Test Tool</h1>
        <p>Server: <strong>http://localhost:8081</strong></p>

        <button onclick="testPing()">Test Ping (1 request)</button>
        <button onclick="testMultiple(100)">Test 100 requests</button>
        <button onclick="testMultiple(500)">Test 500 requests</button>

        <div id="result"></div>
    </div>

    <script>
        const BASE_URL = "http://localhost:8081";

        async function testPing() {
            const start = performance.now();
            try {
                const res = await fetch(BASE_URL + "/api/ping");
                const data = await res.text();
                const time = (performance.now() - start).toFixed(2);

                document.getElementById("result").innerHTML = `
                    <span class="success">✅ Thành công!</span><br>
                    <strong>Time:</strong> ${time} ms<br>
                    <strong>Response:</strong><br>
                    ${data}
                `;
            } catch (err) {
                document.getElementById("result").innerHTML = `<span class="error">❌ Lỗi: ${err.message}</span>`;
            }
        }

        async function testMultiple(count) {
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = `Đang test ${count} requests...`;

            let success = 0;
            let totalTime = 0;
            const start = performance.now();

            for (let i = 0; i < count; i++) {
                try {
                    const res = await fetch(BASE_URL + "/api/ping");
                    if (res.ok) success++;
                    await new Promise(r => setTimeout(r, 1)); // Nhẹ nhàng hơn
                } catch (e) { }
            }

            const elapsed = (performance.now() - start).toFixed(2);
            const avg = (elapsed / count).toFixed(2);

            resultDiv.innerHTML = `
                <strong>Kết quả test ${count} requests:</strong><br>
                <span class="success">Thành công: ${success}/${count}</span><br>
                <strong>Tổng thời gian:</strong> ${elapsed} ms<br>
                <strong>Trung bình:</strong> ${avg} ms/request<br>
                <strong>Throughput:</strong> ${(count / (elapsed / 1000)).toFixed(1)} req/s
            `;
        }
    </script>
</body>

</html>
