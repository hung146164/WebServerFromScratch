<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Server Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Giao diện Dark mode xịn xò */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            font-weight: 800;
            background: -webkit-linear-gradient(#00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        button {
            background: #00c6ff;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 15px;
        }

        button:hover {
            background: #0072ff;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            color: #00ff88;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 C++ API Tester</h1>
        <p style="text-align: center; margin-bottom: 40px; color: #ccc;">
            Giao diện kiểm thử hệ thống WebServer High-Performance
        </p>

        <!-- Thẻ Test API JSON -->
        <div class="card">
            <h2>1. Kiểm tra API lấy dữ liệu</h2>
            <p>Gọi vào endpoint <code>/api/ping</code> để lấy cục JSON.</p>
            <button onclick="testPingApi()">⚡ Gọi API Ping</button>
            <pre id="pingResult">Chưa có dữ liệu. Hãy bấm nút phía trên!</pre>
        </div>

        <!-- Thẻ Test Tải File -->
        <div class="card">
            <h2>2. Kiểm tra Tải File (Zero-Copy)</h2>
            <p>Tải bức ảnh thông qua kỹ thuật Sendfile tốc độ cao.</p>
            <button onclick="testDownload()" style="background: #00ff88; color: #000;">📥 Tải Ảnh de1.jpg</button>
        </div>
    </div>

    <script>
        // Hàm gọi API lấy chuỗi JSON
        async function testPingApi() {
            const resBox = document.getElementById('pingResult');
            resBox.textContent = "Đang gửi Request xuống Server C++...";

            try {
                // Cố gắng lấy dữ liệu từ API
                const response = await fetch('/api/ping');
                if (!response.ok) {
                    throw new Error(`Server trả về lỗi: ${response.status}`);
                }
                const data = await response.json();

                // Ép thành chuỗi JSON đẹp mắt và in ra màn hình
                resBox.textContent = JSON.stringify(data, null, 4);
            } catch (err) {
                resBox.textContent = "❌ Lỗi: Có thể bạn chưa đăng ký API /api/ping trong file main.cpp\n\nChi tiết: " + err.message;
                resBox.style.color = "#ff4444";
            }
        }

        // Hàm kích hoạt tải file
        function testDownload() {
            // Điều hướng thẳng trình duyệt vào link ảnh, HTTP Header của Server sẽ ép nó Save As về máy
            window.location.href = '/api/download_image/de1.jpg?download=true';
        }
    </script>

</body>

</html>
